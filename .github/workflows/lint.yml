name: Lint

on: 
  pull_request:
    branches: [dev-temp]

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze