name: Unit Tests

on:
  pull_request:
    branches:
      [dev]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - run: flutter pub get
        
      - run: dart run build_runner build

      - run: flutter test